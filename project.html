<script>
  let sectionObserver;

  // Section reveal animations with dynamic content support
  function revealSections() {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      },
      {
        threshold: 0.1,
        rootMargin: "0px 0px -50px 0px",
      }
    );

    // Observe existing sections
    const existingSections = document.querySelectorAll(
      ".threed-hero, .threed-gallery"
    );
    existingSections.forEach((section) => {
      observer.observe(section);
    });

    // Return observer for dynamic content
    return observer;
  }

  // Function to observe newly loaded sections
  function observeNewSections(observer) {
    const newSections = document.querySelectorAll(".footer, .thanks");
    newSections.forEach((section) => {
      if (!section.classList.contains("visible")) {
        observer.observe(section);
      }
    });
  }

  $(function () {
    $("#navigatiob_bar").load("./navbar.html");
    sectionObserver = revealSections();

    $("#footer-placeholder").load("footer.html", function () {
      // Reveal animations for dynamically loaded content
      setTimeout(() => {
        observeNewSections(sectionObserver);
      }, 100);
    });
  });
  $(".project-details img").click(function () {
    $("#full-image").attr("src", $(this).attr("src"));
    $("#image-viewer").show();
  });

  $("#image-viewer .close").click(function () {
    $("#image-viewer").hide();
  });
</script>
